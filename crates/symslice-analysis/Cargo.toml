[package]
name = "symslice-analysis"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
symslice-core = { path = "../symslice-core" }
rustc-hash = "2"
symslice-language-support = { path = "../symslice-language-support" }
symslice-storage = { path = "../symslice-storage" }
globset = "0.4"
ignore = "0.4"
petgraph = "0.6"
phf = { version = "0.11", features = ["macros"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

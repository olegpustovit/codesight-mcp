[package]
name = "codesight-backend-lsp"
version = "0.1.0"
edition = "2024"
description = "Generic LSP CodeBackend. Config-driven: per-language server command + init options, no language-specific code paths."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
codesight-backend = { path = "../codesight-backend" }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util", "sync"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

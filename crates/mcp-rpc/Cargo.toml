[package]
name = "mcp-rpc"
version = "0.1.0"
edition = "2024"
description = "Generic MCP (Model Context Protocol) JSON-RPC 2.0 framing: stdio server + client, dispatcher trait."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "signal", "time", "sync", "process"] }
tracing = "0.1"

[package]
name = "codesight-engine"
version = "0.1.1"
edition = "2024"
build = "build.rs"
description = "Engine: MCP tool dispatch, indexing orchestration, tool handlers."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
codesight-analysis = { path = "../codesight-analysis" }
codesight-core = { path = "../codesight-core" }
codesight-language-support = { path = "../codesight-language-support" }
codesight-retrieval = { path = "../codesight-retrieval" }
codesight-storage = { path = "../codesight-storage" }
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io", "macros"] }
dirs = "6.0.0"
globset = "0.4"
ignore = "0.4"
jsonschema = { version = "0.26", default-features = false }
notify = "8"
notify-debouncer-full = "0.5"
parking_lot = "0.12"
rayon = "1"
regex = "1"
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "signal", "time", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

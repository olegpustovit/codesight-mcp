[package]
name = "dowser-analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
dowser-core = { path = "../dowser-core" }
rustc-hash = "2"
dowser-language-support = { path = "../dowser-language-support" }
dowser-storage = { path = "../dowser-storage" }
globset = "0.4"
ignore = "0.4"
petgraph = "0.6"
phf = { version = "0.11", features = ["macros"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[package]
name = "symslice-retrieval"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
heck = "0.5"
blake3 = "1"
symslice-core = { path = "../symslice-core" }
symslice-storage = { path = "../symslice-storage" }
dirs = "6.0.0"
model2vec-rs = "0.1"
nucleo-matcher = "0.3"
htmd = "0.2"
jsonc-parser = { version = "0.26", features = ["serde"] }
rustc-hash = "2"
pulldown-cmark = { version = "0.12", default-features = false }
strsim = "0.11"
serde_json = "1"
serde_yml = "0.0.12"
tracing = "0.1"

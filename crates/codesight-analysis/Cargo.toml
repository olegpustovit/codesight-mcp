[package]
name = "codesight-analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
codesight-core = { path = "../codesight-core" }
codesight-language-support = { path = "../codesight-language-support" }
codesight-storage = { path = "../codesight-storage" }
globset = "0.4"
ignore = "0.4"
petgraph = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

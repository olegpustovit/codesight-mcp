[package]
name = "dowser-storage"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
dowser-core = { path = "../dowser-core" }
rustc-hash = "2"
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
sqlite-vec = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
walkdir = "2"
ignore = "0.4"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "search"
harness = false

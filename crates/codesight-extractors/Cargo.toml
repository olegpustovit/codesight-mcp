[package]
name = "codesight-extractors"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
codesight-core = { path = "../codesight-core" }
codesight-language-support = { path = "../codesight-language-support" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
streaming-iterator = "0.1.9"
toml = "0.8"
tree-sitter = "0.26.8"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "scm"
harness = false

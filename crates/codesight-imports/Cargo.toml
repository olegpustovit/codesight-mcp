[package]
name = "codesight-imports"
version = "0.1.0"
edition = "2024"

[dependencies]
codesight-core = { path = "../codesight-core" }
codesight-extractors = { path = "../codesight-extractors" }
codesight-language-support = { path = "../codesight-language-support" }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tree-sitter = "0.26.8"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[package]
name = "codesight-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
codesight-core = { path = "../codesight-core" }
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tree-sitter = "0.26.8"
tree-sitter-python = "0.25.0"
walkdir = "2"
ignore = "0.4"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "search"
harness = false

[package]
name = "codesight-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
codesight-core = { path = "../codesight-core" }
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26.8"
tree-sitter-python = "0.25.0"
walkdir = "2"

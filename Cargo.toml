[workspace]
members = [".", "crates/codesight-core", "crates/codesight-extractors", "crates/codesight-storage"]
resolver = "2"

[package]
name = "codesight-mcp"
version = "0.1.0"
edition = "2024"
description = "Token-efficient code & documentation retrieval MCP server with AST-based symbol extraction"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
codesight-core = { path = "crates/codesight-core" }
codesight-extractors = { path = "crates/codesight-extractors" }
codesight-storage = { path = "crates/codesight-storage" }
dirs = "6.0.0"
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"
tree-sitter = "0.26.8"
tree-sitter-bash = "0.25.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.1.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-luau = "1.2.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-scss = "1.0.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-swift = "0.7.1"
tree-sitter-typescript = "0.23.2"
streaming-iterator = "0.1.9"
ignore = "0.4"
jsonschema = { version = "0.26", default-features = false }
walkdir = "2"
regex = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-perl = "1.1.2"
tree-sitter-erlang = "0.15.0"
tree-sitter-xml = "0.7.0"
tree-sitter-nix = "0.3.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-fortran = "0.5.1"
tree-sitter-gleam = "1.0.0"

[dev-dependencies]
tempfile = "3"
# `test-util` enables `#[tokio::test(start_paused = true)]` so timeout /
# drain tests can use virtual time instead of real sleeps (saves ~2 s off
# the full test suite). Dev-only: the feature exposes time manipulation
# that must not ship in the production binary.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
# Unwinding (not abort) so the dispatch boundary in src/service/mod.rs can
# catch_unwind around individual tool handlers — one bad file must never take
# down the long-lived MCP server.
panic = "unwind"
strip = true

# Benches inherit from `release` but disable LTO and bump codegen-units so
# repeated bench runs don't rebuild the entire dep graph end-to-end.
# (`panic` is ignored on the bench profile by cargo.)
[profile.bench]
lto = false
codegen-units = 16

[workspace]
members = [
    ".",
    "crates/codesight-analysis",
    "crates/codesight-backend",
    "crates/codesight-core",
    "crates/codesight-engine",
    "crates/codesight-extractors",
    "crates/codesight-imports",
    "crates/codesight-language-support",
    "crates/codesight-retrieval",
    "crates/codesight-storage",
    "crates/mcp-rpc",
]
resolver = "2"

[package]
name = "codesight-mcp"
version = "0.1.0"
edition = "2024"
description = "Token-efficient code & documentation retrieval MCP server with AST-based symbol extraction"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
codesight-analysis = { path = "crates/codesight-analysis" }
codesight-backend = { path = "crates/codesight-backend" }
codesight-core = { path = "crates/codesight-core" }
codesight-engine = { path = "crates/codesight-engine" }
codesight-extractors = { path = "crates/codesight-extractors" }
codesight-imports = { path = "crates/codesight-imports" }
codesight-language-support = { path = "crates/codesight-language-support" }
codesight-retrieval = { path = "crates/codesight-retrieval" }
codesight-storage = { path = "crates/codesight-storage" }
mcp-rpc = { path = "crates/mcp-rpc" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "signal", "time", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
walkdir = "2"

[dev-dependencies]
cargo_metadata = "0.19"
tempfile = "3"
# `test-util` enables `#[tokio::test(start_paused = true)]` so timeout /
# drain tests can use virtual time instead of real sleeps (saves ~2 s off
# the full test suite). Dev-only: the feature exposes time manipulation
# that must not ship in the production binary.
tokio = { version = "1", features = ["test-util"] }
# Tests directly exercise grammar-loading across the supported language set;
# they are grammar-consumers, not through-the-extractor tests.
tree-sitter = "0.26.8"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-luau = "1.2.0"
tree-sitter-php = "0.24.2"
tree-sitter-scss = "1.0.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.1"
tree-sitter-yaml = "0.7.2"
tree-sitter-dart = "0.1.0"
tree-sitter-nix = "0.3.0"
tree-sitter-xml = "0.7.0"

[profile.release]
lto = true
codegen-units = 1
# Unwinding (not abort) so the dispatch boundary in src/service/mod.rs can
# catch_unwind around individual tool handlers — one bad file must never take
# down the long-lived MCP server.
panic = "unwind"
strip = true

# Benches inherit from `release` but disable LTO and bump codegen-units so
# repeated bench runs don't rebuild the entire dep graph end-to-end.
# (`panic` is ignored on the bench profile by cargo.)
[profile.bench]
lto = false
codegen-units = 16

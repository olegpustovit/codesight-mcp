[workspace]
members = [
    ".",
    "crates/dowser-analysis",
    "crates/dowser-core",
    "crates/dowser-engine",
    "crates/dowser-language-support",
    "crates/dowser-retrieval",
    "crates/dowser-storage",
]
resolver = "2"

[package]
name = "dowser-mcp"
version = "0.2.0"
edition = "2024"
description = "Local MCP server for indexed source-code search and reading"
license = "Apache-2.0"
# Every tests/*.rs would otherwise compile as its own binary (85 link steps,
# each pulling the full engine+tokio+rmcp graph). One consolidated binary
# re-uses the link once; each test still appears individually in nextest as
# `integration::<file>::<fn>`.
autotests = false

[[test]]
name = "integration"
path = "tests/all.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dowser-analysis = { path = "crates/dowser-analysis" }
dowser-core = { path = "crates/dowser-core" }
dowser-engine = { path = "crates/dowser-engine" }
dowser-language-support = { path = "crates/dowser-language-support" }
dowser-retrieval = { path = "crates/dowser-retrieval" }
dowser-storage = { path = "crates/dowser-storage" }
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io", "macros"] }
rustc-hash = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52.1", features = ["rt", "macros", "io-util", "io-std", "signal", "time", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
walkdir = "2"

[dev-dependencies]
cargo_metadata = "0.19"
tempfile = "3"
# `test-util` enables `#[tokio::test(start_paused = true)]` so timeout /
# drain tests can use virtual time instead of real sleeps (saves ~2 s off
# the full test suite). Dev-only: the feature exposes time manipulation
# that must not ship in the production binary.
tokio = { version = "1.52.1", features = ["test-util"] }

[profile.dev]
# Full DWARF dominates link time when fanned across many test binaries.
# line-tables-only keeps panic backtraces (file:line) and drops type info.
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
inherits = "dev"

[profile.release]
lto = true
codegen-units = 1
# Unwinding (not abort) so the dispatch boundary in src/service/mod.rs can
# catch_unwind around individual tool handlers — one bad file must never take
# down the long-lived MCP server.
panic = "unwind"
strip = true

# Benches inherit from `release` but disable LTO and bump codegen-units so
# repeated bench runs don't rebuild the entire dep graph end-to-end.
# (`panic` is ignored on the bench profile by cargo.)
[profile.bench]
lto = false
codegen-units = 16

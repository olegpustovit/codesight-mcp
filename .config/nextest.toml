# cargo-nextest repository config — see https://nexte.st/book/configuration.html
#
# Buckets:
# - default: full integration suite; generous slow-timeout so structural tests
#   finish on slower disks
# - ci: same as default but no fail-fast cancel
#
# Historical note: this file used to cap a "heavy" test-group at max-threads=4
# and tag ~13 integration binaries into it, because cold ingest was ~2.6 s per
# test (full ExtractorRegistry rebuild + SQLite init) and running all 50+
# heavy tests in parallel made CI thrash memory. After worklog #17 (c)/(d)
# — process-wide ExtractorRegistry cache + lazy per-language SCM compile —
# per-test peak memory and CPU dropped by an order of magnitude, so the
# throttle now just forces idle cores at full-suite time. Removed.

[profile.default]
slow-timeout = { period = "90s", terminate-after = 2 }

[profile.ci]
fail-fast = false
